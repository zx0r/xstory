# =============================================================================
#                 QUALITY GATES CONTINUOUS INTEGRATION PIPELINE
# =============================================================================
# Level: Principal Systems Architect & DevSecOps Engineer
# Standards: OpenSSF Scorecard Hardened · Hermetic Toolchain · SLSA Level 3
# Architecture: 5-Gate Directed Acyclic Graph (DAG) with Single Protected Aggregator
# Guarantees:
#   1. Complete Supply Chain Integrity (SHA-pinned immutable actions, verified egress)
#   2. Cache Poisoning Prevention (Isolated cache namespaces across compilation profiles)
#   3. Zero Memory-Model & Concurrency UB (Miri Tree Borrows & strict provenance)
#   4. Process Isolation & E2E Verification (Sub-millisecond shell history engine)
# =============================================================================

name: "CI Quality Gates"

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  # Required trigger for GitHub Merge Queue (monitored merge groups)
  merge_group:

# Least-privilege default permissions per OpenSSF Scorecard L4 mandate
permissions:
  contents: "read"

# Concurrency Management:
# - On Pull Requests: Cancels in-progress runs when new commits arrive to conserve runners.
# - On Main & Merge Queue: Strictly prevents cancellation to ensure cache-warming finishes.
concurrency:
  group: "ci-${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress:
    ${{ github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/heads/gh-readonly-queue/')
    }}

env:
  CARGO_TERM_COLOR: "always"
  CARGO_INCREMENTAL: "0" # Disable incremental compilation to optimize CI cache hit ratios & artifact size
  MIRI_NIGHTLY: "nightly-2026-10-28"

defaults:
  run:
    shell: "bash"

jobs:
  # ----------------------------------------------------------------------------
  # Gate 1: Fast Static Verification (< 45s feedback SLA)
  # ----------------------------------------------------------------------------
  # Purpose: Fast-fail validation on formatting, lints, and dependency hygiene
  # Optimization: Executes zero-compilation AST checks before downloading multi-MB caches
  fast-checks:
    name: "🛡️ [Gate 1] Lint, Format & Hygiene"
    runs-on: "ubuntu-24.04"
    timeout-minutes: 10
    steps:
      # StepSecurity Harden-Runner: Audits and enforces outbound network boundaries
      - name: "Harden Runner (Egress Audit)"
        uses: "step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43" # v2.22.3
        with:
          egress-policy: "audit"

      # Immutable commit SHA checkout prevents upstream tag tampering (OpenSSF L4)
      - name: "Checkout Source Code"
        uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1" # v7.0.1
        with:
          persist-credentials: false

      # Fail-Fast Check 1: Formatting compliance without compiler invocation (< 2s)
      - name: "Verify Rust Formatting Compliance (Fail-Fast)"
        run: "cargo fmt --all -- --check"

      # Install cargo-machete binary via pre-compiled GitHub release installer
      - name: "Install Developer Utilities (cargo-machete)"
        uses: "taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32" # v2.88.0
        with:
          tool: "cargo-machete@0.9.2"

      # Fail-Fast Check 2: Parse Cargo.toml manifests to detect unused dependencies
      - name: "Detect Unused Dependencies (Fail-Fast)"
        run: "cargo machete"

      # Enforce pinned toolchain version declared in rust-toolchain.toml (1.96.0)
      - name: "Introspect Pinned Rust Toolchain"
        run: "rustup show"

      # Primary compiler artifact cache (Profile: Check/Clippy)
      # Uses unique shared-key to prevent pollution from coverage or test builds
      - name: "Setup Rust Cache (Check Profile)"
        uses: "Swatinem/rust-cache@9d47c6ad4b02e050fd481d890b2ea34778fd09d6" # v2.7.8
        with:
          shared-key: "gate1-clippy"
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # Strict Clippy Static Analysis: Denies all warnings across workspace and tests
      # Enforces --locked to guarantee hermetic builds against Cargo.lock
      - name: "Run Clippy (Strict Warnings)"
        run: "cargo clippy --locked --workspace --all-targets --all-features -- -D warnings"

      # Rustdoc Build Verification: Ensures zero broken intra-doc links or missing docs
      - name: "Verify Documentation Generation"
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: "cargo doc --locked --no-deps --all-features"

  # ----------------------------------------------------------------------------
  # Gate 2: Supply Chain Security & License Policy (cargo-deny)
  # ----------------------------------------------------------------------------
  # Purpose: Audits dependency tree against RustSec advisory database, bans list,
  # approved open-source licenses, and trusted crate sources
  security-audit:
    name: "🔐 [Gate 2] Supply Chain & License Audit"
    runs-on: "ubuntu-24.04"
    timeout-minutes: 10
    steps:
      - name: "Harden Runner (Egress Audit)"
        uses: "step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43" # v2.22.3
        with:
          egress-policy: "audit"

      - name: "Checkout Source Code"
        uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1" # v7.0.1
        with:
          persist-credentials: false

      # Executes cargo-deny v0.20+ with zero tolerance for security advisories or unapproved licenses
      - name: "Audit Vulnerabilities, Licenses, Bans & Sources"
        uses: "EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25" # v2.1.1 (cargo-deny 0.20.2)
        with:
          command: "check"
          arguments: "--locked --all-features"

  # ----------------------------------------------------------------------------
  # Gate 3: Test Execution & LLVM Source Coverage (Nextest + Neovim E2E)
  # ----------------------------------------------------------------------------
  # Purpose: Process-isolated unit/integration tests with source-based LLVM coverage
  # Security: Withholds id-token permissions to eliminate OIDC leakage in test runners
  test-and-coverage:
    name: "🧪 [Gate 3] Process-Isolated Tests & Coverage"
    needs: ["fast-checks", "security-audit"]
    runs-on: "ubuntu-24.04"
    timeout-minutes: 20
    permissions:
      contents: "read"
    env:
      # Directs LLVM coverage instrumentation into standard target/
      # Allows Swatinem/rust-cache to prune test binaries and profraw dumps properly
      CARGO_LLVM_COV_TARGET_DIR: "target"
    steps:
      - name: "Harden Runner (Egress Audit)"
        uses: "step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43" # v2.22.3
        with:
          egress-policy: "audit"

      - name: "Checkout Source Code"
        uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1" # v7.0.1
        with:
          persist-credentials: false

      # Dedicated cache bucket for instrumented coverage compilation
      - name: "Setup Rust Cache (Coverage Profile)"
        uses: "Swatinem/rust-cache@9d47c6ad4b02e050fd481d890b2ea34778fd09d6" # v2.7.8
        with:
          shared-key: "gate3-llvm-cov"
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # Install pinned, reproducible test runners and instrumentation tooling
      - name: "Install Pinned Nextest & LLVM Source Coverage"
        uses: "taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32" # v2.88.0
        with:
          tool: "cargo-nextest@0.9.92,cargo-llvm-cov@0.6.16"

      # Process-Isolated Test Execution & Minimum Coverage Gate:
      # Nextest executes each test in its own POSIX process, preventing thread-local pollution
      # Fails pipeline if total line coverage drops below 55% threshold
      - name: "Execute Isolated Tests with LLVM Coverage & Minimum Gate"
        run: |
          mkdir -p target/llvm-cov
          cargo llvm-cov nextest \
            --locked \
            --profile ci \
            --workspace \
            --all-features \
            --lcov \
            --output-path target/llvm-cov/lcov.info \
            --fail-under-lines 55

      # Upload coverage report artifact for external ingestion & PR decoration
      - name: "Upload Coverage Artifact for External Reporting"
        uses: "actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882" # v4.4.3
        with:
          name: "lcov-report"
          path: "target/llvm-cov/lcov.info"
          if-no-files-found: "error"
          retention-days: 1

  # ----------------------------------------------------------------------------
  # Gate 4: Memory Model Verification & Undefined Behavior (Miri)
  # ----------------------------------------------------------------------------
  # Purpose: Executes unit tests under the Miri interpreter with Tree Borrows aliasing,
  # symbolic pointer alignment checks, and strict provenance enforcement
  miri-verification:
    name: "🔬 [Gate 4] Memory Safety & Tree Borrows (Miri)"
    needs: ["fast-checks"]
    runs-on: "ubuntu-24.04"
    timeout-minutes: 20
    steps:
      - name: "Harden Runner (Egress Audit)"
        uses: "step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43" # v2.22.3
        with:
          egress-policy: "audit"

      - name: "Checkout Source Code"
        uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1" # v7.0.1
        with:
          persist-credentials: false

      # Installs verified Nightly toolchain with pre-compiled Miri and standard library sources
      - name: "Install Pinned Nightly Rust with Miri"
        run: |
          rustup toolchain install "${MIRI_NIGHTLY}" --profile minimal --component miri,rust-src
          rustup override set "${MIRI_NIGHTLY}"

      # Caches Miri's pre-compiled standard library sysroot in ~/.cache/miri
      # Eliminates 40-60s of std recompilation overhead on subsequent CI runs
      - name: "Setup Rust Cache (Miri Sysroot & Target)"
        uses: "Swatinem/rust-cache@9d47c6ad4b02e050fd481d890b2ea34778fd09d6" # v2.7.8
        with:
          shared-key: "gate4-miri"
          cache-directories: "/home/runner/.cache/miri"
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # Memory Safety Verification:
      # - -Zmiri-disable-isolation: Required because layout unit tests verify atomic tempfile creation
      # - -Zmiri-tree-borrows: Enforces next-generation pointer aliasing rules
      # - -Zmiri-strict-provenance: Detects integer-to-pointer casting violations
      - name: "Run Miri Memory Safety Verification"
        env:
          MIRIFLAGS:
            "-Zmiri-disable-isolation -Zmiri-tree-borrows -Zmiri-symbolic-alignment-check
            -Zmiri-strict-provenance"
        run: "cargo miri test --locked --workspace --lib"

  # ----------------------------------------------------------------------------
  # Gate 5: Single Branch Protection & Merge Queue Aggregator
  # ----------------------------------------------------------------------------
  # Purpose: Terminal aggregator job that evaluates all upstream gate results.
  # Enterprise Benefit: Simplifies GitHub Branch Protection rulesets and Terraform IaC
  # by requiring only "ci-gate" as a mandatory status check.
  ci-gate:
    name: "✅ [Gate Final] All Quality Gates Passed"
    needs: ["fast-checks", "security-audit", "test-and-coverage", "miri-verification"]
    if: ${{ always() }}
    runs-on: "ubuntu-24.04"
    timeout-minutes: 2
    steps:
      - name: "Evaluate Upstream Gate Verdicts"
        run: |
          set -euo pipefail
          if [[ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" == "true" ]]; then
            echo "::error::One or more mandatory quality gates failed or were cancelled."
            exit 1
          fi
          echo "All quality gates succeeded."
