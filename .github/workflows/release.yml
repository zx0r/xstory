# =============================================================================
# ENTERPRISE MULTI-ARCH DISTRIBUTION & SUPPLY CHAIN PROVENANCE PIPELINE
# =============================================================================
# Level: Principal Systems Architect & Release Engineer
# Standards: SLSA Level 3 · OIDC Trusted Publishing · Sigstore Attestation
# Engine: cargo-dist v0.33.1 · cargo-auditable RFC Standard
# Target Matrix:
#   - macOS (Apple Silicon arm64, Intel x86_64)
#   - Linux (glibc x86_64/arm64, musl x86_64/arm64 static binaries)
#   - Windows (MSVC x86_64/arm64)
# Artifacts:
#   - Self-updating binaries (xstory-update)
#   - Cryptographic SHA-256 digests
#   - Homebrew Tap Formula (zx0r/homebrew-tap/Formula/xstory.rb)
#   - Universal Shell & PowerShell Installers
#   - crates.io Package Publication via OIDC Workload Identity
# =============================================================================

name: Release
permissions:
  "contents": "write"

# This task will run whenever you push a git tag that looks like a version
# like "1.0.0", "v0.1.0-prerelease.1", "my-app/0.1.0", "releases/v1.0.0", etc.
# Various formats will be parsed into a VERSION and an optional PACKAGE_NAME, where
# PACKAGE_NAME must be the name of a Cargo package in your workspace, and VERSION
# must be a Cargo-style SemVer Version (must have at least major.minor.patch).
#
# If PACKAGE_NAME is specified, then the announcement will be for that
# package (erroring out if it doesn't have the given version or isn't dist-able).
#
# If PACKAGE_NAME isn't specified, then the announcement will be for all
# (dist-able) packages in the workspace with that version (this mode is
# intended for workspaces with only one dist-able package, or with all dist-able
# packages versioned/released in lockstep).
#
# If you push multiple tags at once, separate instances of this workflow will
# spin up, creating an independent announcement for each one. However, GitHub
# will hard limit this to 3 tags per commit, as it will assume more tags is a
# mistake.
#
# If there's a prerelease-style suffix to the version, then the release(s)
# will be marked as a prerelease.
on:
  pull_request:
  push:
    tags:
      - '**[0-9]+.[0-9]+.[0-9]+*'

jobs:
  # Run 'dist plan' (or host) to determine what tasks we need to do
  plan:
    runs-on: "ubuntu-latest"
    outputs:
      val: ${{ steps.plan.outputs.manifest }}
      tag: ${{ !github.event.pull_request && github.ref_name || '' }}
      tag-flag: ${{ !github.event.pull_request && format('--tag={0}', github.ref_name) || '' }}
      publishing: ${{ !github.event.pull_request }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive
      - name: Install dist
        # we specify bash to get pipefail; it guards against the `curl` command
        # failing. otherwise `sh` won't catch that `curl` returned non-0
        shell: bash
        run: "curl --proto '=https' --tlsv1.2 -LsSf https://github.com/axodotdev/cargo-dist/releases/download/v0.33.1/cargo-dist-installer.sh | sh"
      - name: Cache dist
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cargo-dist-cache
          path: ~/.cargo/bin/dist
      # sure would be cool if github gave us proper conditionals...
      # so here's a doubly-nested ternary-via-truthiness to try to provide the best possible
      # functionality based on whether this is a pull_request, and whether it's from a fork.
      # (PRs run on the *source* but secrets are usually on the *target* -- that's *good*
      # but also really annoying to build CI around when it needs secrets to work right.)
      - id: plan
        run: |
          dist ${{ (!github.event.pull_request && format('host --steps=create --tag={0}', github.ref_name)) || 'plan' }} --output-format=json > plan-dist-manifest.json
          echo "dist ran successfully"
          cat plan-dist-manifest.json
          echo "manifest=$(jq -c "." plan-dist-manifest.json)" >> "$GITHUB_OUTPUT"
      - name: "Upload dist-manifest.json"
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: artifacts-plan-dist-manifest
          path: plan-dist-manifest.json

  # Build and packages all the platform-specific things
  build-local-artifacts:
    name: build-local-artifacts (${{ join(matrix.targets, ', ') }})
    # Let the initial task tell us to not run (currently very blunt)
    needs:
      - plan
    if: ${{ fromJson(needs.plan.outputs.val).ci.github.artifacts_matrix.include != null && (needs.plan.outputs.publishing == 'true' || fromJson(needs.plan.outputs.val).ci.github.pr_run_mode == 'upload') }}
    strategy:
      fail-fast: false
      # Target platforms/runners are computed by dist in create-release.
      # Each member of the matrix has the following arguments:
      #
      # - runner: the github runner
      # - dist-args: cli flags to pass to dist
      # - install-dist: expression to run to install dist on the runner
      #
      # Typically there will be:
      # - 1 "global" task that builds universal installers
      # - N "local" tasks that build each platform's binaries and platform-specific installers
      matrix: ${{ fromJson(needs.plan.outputs.val).ci.github.artifacts_matrix }}
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.container && matrix.container.image || null }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      BUILD_MANIFEST_NAME: target/distrib/${{ join(matrix.targets, '-') }}-dist-manifest.json
    permissions:
      "attestations": "write"
      "contents": "read"
      "id-token": "write"
    steps:
      - name: enable windows longpaths
        run: |
          git config --global core.longpaths true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive
      - name: Install Rust non-interactively if not already installed
        if: ${{ matrix.container }}
        run: |
          if ! command -v cargo > /dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
            echo "$HOME/.cargo/bin" >> $GITHUB_PATH
          fi
      - uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ${{ join(matrix.targets, '-') }}
          cache-provider: ${{ matrix.cache_provider }}
      - name: Install dist
        run: ${{ matrix.install_dist.run }}
      # Get the dist-manifest
      - name: Fetch local artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: artifacts-*
          path: target/distrib/
          merge-multiple: true
      - name: Install cargo-auditable
        run: ${{ matrix.install_cargo_auditable.run }}
      - name: Install dependencies
        run: |
          ${{ matrix.packages_install }}
      - name: Build artifacts
        run: |
          # Actually do builds and make zips and whatnot
          dist build ${{ needs.plan.outputs.tag-flag }} --print=linkage --output-format=json ${{ matrix.dist_args }} > dist-manifest.json
          echo "dist ran successfully"
      - name: Attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: "target/distrib/*${{ join(matrix.targets, ', ') }}*"
      - id: cargo-dist
        name: Post-build
        # We force bash here just because github makes it really hard to get values up
        # to "real" actions without writing to env-vars, and writing to env-vars has
        # inconsistent syntax between shell and powershell.
        shell: bash
        run: |
          # Parse out what we just built and upload it to scratch storage
          echo "paths<<EOF" >> "$GITHUB_OUTPUT"
          dist print-upload-files-from-manifest --manifest dist-manifest.json >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

          cp dist-manifest.json "$BUILD_MANIFEST_NAME"
      - name: "Upload artifacts"
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: artifacts-build-local-${{ join(matrix.targets, '_') }}
          path: |
            ${{ steps.cargo-dist.outputs.paths }}
            ${{ env.BUILD_MANIFEST_NAME }}

  # Build and package all the platform-agnostic(ish) things
  build-global-artifacts:
    needs:
      - plan
      - build-local-artifacts
    runs-on: "ubuntu-latest"
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      BUILD_MANIFEST_NAME: target/distrib/global-dist-manifest.json
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive
      - name: Install cached dist
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: cargo-dist-cache
          path: ~/.cargo/bin/
      - run: chmod +x ~/.cargo/bin/dist
      - name: Install cargo-cyclonedx
        # we specify bash to get pipefail; it guards against the `curl` command
        # failing. otherwise `sh` won't catch that `curl` return non-0
        run: "curl --proto '=https' --tlsv1.2 -LsSf https://github.com/CycloneDX/cyclonedx-rust-cargo/releases/download/cargo-cyclonedx-0.5.5/cargo-cyclonedx-installer.sh | sh"
        shell: bash
      # Get all the local artifacts for the global tasks to use (for e.g. checksums)
      - name: Fetch local artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: artifacts-*
          path: target/distrib/
          merge-multiple: true
      - id: cargo-dist
        shell: bash
        run: |
          dist build ${{ needs.plan.outputs.tag-flag }} --output-format=json "--artifacts=global" > dist-manifest.json
          echo "dist ran successfully"

          # Parse out what we just built and upload it to scratch storage
          echo "paths<<EOF" >> "$GITHUB_OUTPUT"
          jq --raw-output ".upload_files[]" dist-manifest.json >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

          cp dist-manifest.json "$BUILD_MANIFEST_NAME"
      - name: Fix Homebrew Formula
        shell: bash
        run: |
          ruby <<'EOF'
          require 'json'
          require 'digest'
          manifest = JSON.parse(File.read('dist-manifest.json'))

          # Get version from the first release
          version = manifest['app_version'] || manifest['releases'][0]['app_version']
          puts "App Version: #{version}"

          # Get all artifact objects from the top-level artifacts map
          all_artifacts = manifest['artifacts'].values

          def find_asset(artifacts, target)
            # Find the .tar.gz for the target
            asset = artifacts.find { |a| a['target_triples']&.include?(target) && a['name']&.end_with?('.tar.gz') }

            # Fallback: search by name pattern
            asset ||= artifacts.find { |a| a['name']&.include?(target) && a['name']&.end_with?('.tar.gz') }

            if asset.nil?
              puts "::error::Could not find .tar.gz artifact for target #{target}"
              exit 1
            end

            # Calculate the actual SHA256 from the file itself
            file_path = "target/distrib/#{asset['name']}"
            if !File.exist?(file_path)
              # Try root if not in target/distrib
              file_path = asset['name']
            end

            if File.exist?(file_path)
              asset['actual_sha256'] = Digest::SHA256.file(file_path).hexdigest
              puts "Calculated hash for #{asset['name']}: #{asset['actual_sha256']}"
            else
              puts "::error::Artifact file not found: #{asset['name']}"
              exit 1
            end

            asset
          end

          arm_mac = find_asset(all_artifacts, 'aarch64-apple-darwin')
          intel_mac = find_asset(all_artifacts, 'x86_64-apple-darwin')
          linux_x86 = find_asset(all_artifacts, 'x86_64-unknown-linux-gnu')

          formula_path = "target/distrib/xstory.rb"

          formula = <<~RUBY
            class Xstory < Formula
              desc "Minimalist Unix shell history engine"
              homepage "https://github.com/zx0r/xstory"
              version "#{version}"

              if OS.mac? && Hardware::CPU.arm?
                url "https://github.com/zx0r/xstory/releases/download/v#{version}/#{arm_mac['name']}"
                sha256 "#{arm_mac['actual_sha256']}"
              elsif OS.mac? && Hardware::CPU.intel?
                url "https://github.com/zx0r/xstory/releases/download/v#{version}/#{intel_mac['name']}"
                sha256 "#{intel_mac['actual_sha256']}"
              elsif OS.linux? && Hardware::CPU.intel?
                url "https://github.com/zx0r/xstory/releases/download/v#{version}/#{linux_x86['name']}"
                sha256 "#{linux_x86['actual_sha256']}"
              end

              license "MIT OR Apache-2.0"

              def install
                bin.install "xstory"
              end

              test do
                system "\#{bin}/xstory", "--version"
              end
            end
          RUBY

          File.write(formula_path, formula)
          puts "Successfully fixed Homebrew formula at #{formula_path}"
          EOF




      - id: cargo-cyclonedx
        shell: bash
        run: |
            # Generate SBOM (.cdx.xml) files.
            cargo cyclonedx -v

            # Move all SBOM (.cdx.xml) files under target/distrib/ since
            # we expect all artifacts to be in that folder.
            find . -name '*.cdx.xml' -exec mv '{}' target/distrib/ ';'

            echo "paths<<EOF" >> "$GITHUB_OUTPUT"
            find . -name '*.cdx.xml' | tee -a "$GITHUB_OUTPUT"
            echo "EOF" >> "$GITHUB_OUTPUT"
      - name: "Upload artifacts"
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: artifacts-build-global
          path: |
            ${{ steps.cargo-dist.outputs.paths }}
            ${{ steps.cargo-cyclonedx.output.paths }}
            ${{ env.BUILD_MANIFEST_NAME }}
  # Determines if we should publish/announce
  host:
    needs:
      - plan
      - build-local-artifacts
      - build-global-artifacts
    # Only run if we're "publishing", and only if plan, local and global didn't fail (skipped is fine)
    if: ${{ always() && needs.plan.result == 'success' && needs.plan.outputs.publishing == 'true' && (needs.build-global-artifacts.result == 'skipped' || needs.build-global-artifacts.result == 'success') && (needs.build-local-artifacts.result == 'skipped' || needs.build-local-artifacts.result == 'success') }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    runs-on: "ubuntu-latest"
    outputs:
      val: ${{ steps.host.outputs.manifest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive
      - name: Install cached dist
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: cargo-dist-cache
          path: ~/.cargo/bin/
      - run: chmod +x ~/.cargo/bin/dist
      # Fetch artifacts from scratch-storage
      - name: Fetch artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: artifacts-*
          path: target/distrib/
          merge-multiple: true
      - id: host
        shell: bash
        run: |
          dist host ${{ needs.plan.outputs.tag-flag }} --steps=upload --steps=release --output-format=json > dist-manifest.json
          echo "artifacts uploaded and released successfully"
          cat dist-manifest.json
          echo "manifest=$(jq -c "." dist-manifest.json)" >> "$GITHUB_OUTPUT"
      - name: "Upload dist-manifest.json"
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          # Overwrite the previous copy
          name: artifacts-dist-manifest
          path: dist-manifest.json
      # Create a GitHub Release while uploading all files to it
      - name: "Download GitHub Artifacts"
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: artifacts-*
          path: artifacts
          merge-multiple: true
      - name: Cleanup
        run: |
          # Remove the granular manifests
          rm -f artifacts/*-dist-manifest.json
      - name: Create GitHub Release
        env:
          PRERELEASE_FLAG: "${{ fromJson(steps.host.outputs.manifest).announcement_is_prerelease && '--prerelease' || '' }}"
          ANNOUNCEMENT_TITLE: "${{ fromJson(steps.host.outputs.manifest).announcement_title }}"
          ANNOUNCEMENT_BODY: "${{ fromJson(steps.host.outputs.manifest).announcement_github_body }}"
          RELEASE_COMMIT: "${{ github.sha }}"
        run: |
          # Write and read notes from a file to avoid quoting breaking things
          echo "$ANNOUNCEMENT_BODY" > $RUNNER_TEMP/notes.txt

          gh release create "${{ needs.plan.outputs.tag }}" --target "$RELEASE_COMMIT" $PRERELEASE_FLAG --title "$ANNOUNCEMENT_TITLE" --notes-file "$RUNNER_TEMP/notes.txt" artifacts/*

  publish-homebrew-formula:
    needs:
      - plan
      - host
    runs-on: "ubuntu-latest"
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      PLAN: ${{ needs.plan.outputs.val }}
      GITHUB_USER: ${{ github.actor }}
      GITHUB_EMAIL: ${{ github.actor }}@users.noreply.github.com
    if: ${{ !fromJson(needs.plan.outputs.val).announcement_is_prerelease || fromJson(needs.plan.outputs.val).publish_prereleases }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
          repository: "zx0r/homebrew-tap"
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
      # So we have access to the formula
      - name: Fetch homebrew formulae
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: artifacts-*
          path: Formula/
          merge-multiple: true
      # This is extra complex because you can make your Formula name not match your app name
      # so we need to find releases with a *.rb file, and publish with that filename.
      - name: Commit formula files
        run: |
          git config --global user.name "${GITHUB_USER}"
          git config --global user.email "${GITHUB_EMAIL}"

          for release in $(echo "$PLAN" | jq --compact-output '.releases[] | select([.artifacts[] | endswith(".rb")] | any)'); do
            filename=$(echo "$release" | jq '.artifacts[] | select(endswith(".rb"))' --raw-output)
            name=$(echo "$filename" | sed "s/\.rb$//")
            version=$(echo "$release" | jq .app_version --raw-output)

            export PATH="/home/linuxbrew/.linuxbrew/bin:$PATH"
            brew update
            # We avoid reformatting user-provided data such as the app description and homepage.
            brew style --except-cops FormulaAudit/Homepage,FormulaAudit/Desc,FormulaAuditStrict --fix "Formula/${filename}" || true

            git add "Formula/${filename}"
            git commit -m "${name} ${version}"
          done
          git push

  publish-crates-io:
    name: Publish to crates.io
    needs:
      - plan
      - host
    runs-on: ubuntu-latest
    # Run only if the plan includes publishing and it's not a draft/prerelease build
    # (unless prerelease publication is explicitly allowed)
    if: ${{ needs.plan.outputs.publishing == 'true' && (!fromJson(needs.plan.outputs.val).announcement_is_prerelease || fromJson(needs.plan.outputs.val).publish_prereleases) }}
    
    # =========================================================================
    # 📚 OIDC TRUSTED PUBLISHING MANUAL (Best Practice)
    # =========================================================================
    # To securely publish to crates.io without storing permanent API tokens,
    # follow these 4 phases. Once completed, uncomment Phase 4 in this file.
    #
    # --- PHASE 1: Bootstrap (Manual) -----------------------------------------
    # crates.io requires the very first version (v0.1.0) to be published manually.
    # 1. Generate a temporary API token at: https://crates.io/settings/tokens
    #    (Scopes: publish-new, publish-update).
    # 2. In your local terminal run: `cargo login <TOKEN>`
    # 3. Publish the first version: `cargo publish`
    # 4. REVOKE the token on crates.io. Your local machine is now clean.
    #
    # --- PHASE 2: GitHub Environment (Security) ------------------------------
    # 1. Go to your repo: Settings -> Environments -> "New environment".
    # 2. Name it EXACTLY: `crates.io`
    # 3. (Recommended): Check "Required reviewers" and select yourself.
    # 4. Under "Deployment branches and tags", select "Selected branches and tags".
    #    Add rule: `v*` (Allows deployment only from release tags).
    #
    # --- PHASE 3: crates.io Trusted Publisher --------------------------------
    # 1. Go to: https://crates.io/crates/xstory/settings/new-trusted-publisher
    # 2. Select "GitHub Actions".
    # 3. Repository: `zx0r/xstory`
    # 4. Workflow name: `release.yml`
    # 5. Environment name: `crates.io` (Must match Phase 2).
    #
    # --- PHASE 4: Workflow Activation ----------------------------------------
    # UNCOMMENT the `environment` and `permissions` blocks below, and replace 
    # the dummy `echo` script with `cargo publish`.
    # =========================================================================
    
    # [UNCOMMENT AFTER SETUP]
    environment:
      name: crates.io
      url: https://crates.io/crates/${{ github.event.repository.name }}
    permissions:
       contents: read    # Required to checkout the code
       id-token: write   # Required to request JWT token from GitHub OIDC
    
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        
      - name: Install Rust toolchain
        run: rustup show
       
      - name: Authenticate with crates.io
        uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6
        id: auth
        
      - name: Publish Package
        shell: bash
        run: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}   
        
  announce:
    name: Announce Release
    needs:
      - plan
      - host
      - publish-homebrew-formula
      - publish-crates-io
    # Use `always()` to wait for all publication jobs.
    # Allow skipping Homebrew and crates.io (e.g. for local test builds),
    # but `host` must complete successfully.
    if: ${{ always() && needs.host.result == 'success' && (needs.publish-homebrew-formula.result == 'skipped' || needs.publish-homebrew-formula.result == 'success') && (needs.publish-crates-io.result == 'skipped' || needs.publish-crates-io.result == 'success') }}
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive
   
