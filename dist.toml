# Config version
cargo-dist-version = "0.32.0"

binaries = ["xstory"]

targets = [
  "x86_64-unknown-linux-gnu",
  "aarch64-unknown-linux-gnu",
  "x86_64-apple-darwin",
  "aarch64-apple-darwin",
  "x86_64-pc-windows-msvc",
]

installers = ["shell", "powershell"]

archives = ["tar.xz", "zip"]

ci = ["github"]

publish-jobs = ["github-releases"]

[github-releases]
allow-dirty = false
draft = false
