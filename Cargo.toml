[package]
name = "xstory"
version = "0.1.0"
edition = "2024"

[dependencies]
crossterm = "0.29"
ratatui = { version = "0.30.2", default-features = false, features = [
  "crossterm",
] }
memmap2 = "0.9"
nucleo-matcher = "0.3"
tree-sitter = "0.27.1"
tree-sitter-bash = "0.25.1"
rayon = "1.10"
memchr = "2.7"

[dev-dependencies]
tempfile = "3"
criterion = { version = "0.8.2", default-features = false }
assert_cmd = "2"
predicates = "3"

[[bench]]
name = "search_bench"
harness = false

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"
incremental = false

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
unwrap_used = "warn"
