[package]
name = "xstory"
version = "0.1.0"
edition = "2024"

[dependencies]
crossterm = "0.28"
ratatui = { version = "0.29", default-features = false, features = ["crossterm"] }
memmap2 = "0.9"
nucleo-matcher = "0.3"
tree-sitter = "0.24"
tree-sitter-bash = "0.23"
rayon = "1.10"
memchr = "2.7"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
unwrap_used = "warn"
